# maintainer-merge: the single merge arbiter for Tier A repositories.
#
# Lives ONLY in JiusiServe/omni-maintainer. One concurrency group serializes
# every merge decision across repositories, and each candidate is
# re-evaluated on a fresh snapshot immediately before `gh pr merge
# --match-head-commit`, so the daily cap and every other rule are decided
# atomically.
#
# The evaluator is installed from this repository's own `main` checkout:
# `main` is ruleset-protected and human-merge-only, so the checkout IS the
# pin (a commit SHA would have to point at itself).
name: maintainer-merge

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintainer-merge
  cancel-in-progress: false

jobs:
  arbiter:
    runs-on: ubuntu-latest
    environment: gate
    timeout-minutes: 30
    steps:
      - name: Mint the gate App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.GATE_APP_ID }}
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          owner: JiusiServe
          repositories: omni-reviewbot,InferMatrixCopilot,omni-maintainer

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the evaluator from main
        run: |
          python -m pip install --quiet .
          python -m omni_maintainer --version

      - name: Merge Tier A pull requests that pass a fresh, complete bar
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        # --workdir is a directory into which the arbiter clones each Tier A
        # repository's bare objects (no checkout, nothing executed) so revert
        # PRs can be verified against the recorded pre-merge commit.
        run: python -m omni_maintainer gate arbiter --workdir "$RUNNER_TEMP/work"
