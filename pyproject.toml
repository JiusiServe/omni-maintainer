[project]
name = "omni-maintainer"
version = "0.1.0"
description = "Self-maintenance tooling for InferMatrixCopilot and omni-reviewbot: gate evaluation, canary monitoring, and routine helpers."
requires-python = ">=3.11"
# Runtime is standard-library only on purpose: the code runs inside GitHub
# Actions and cloud routines that start from a bare interpreter, and every
# extra dependency is one more thing a gate can fail on.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]   # pyyaml: the workflow-topology tests parse the gate workflows

[project.scripts]
omni-maintainer = "omni_maintainer.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_maintainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
